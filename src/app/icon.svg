<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Canvas Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="url(#primary-grad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring-grad)" stroke-width="26" filter="url(#glow)" />
  
  <!-- Timeline Arc highlight -->
  <path d="M 256 96 A 160 160 0 0 1 416 256" fill="none" stroke="#38bdf8" stroke-width="26" stroke-linecap="round" />

  <!-- Cardinal Hour Markers -->
  <circle cx="256" cy="120" r="8" fill="#93c5fd" />
  <circle cx="392" cy="256" r="8" fill="#93c5fd" />
  <circle cx="256" cy="392" r="8" fill="#93c5fd" />
  <circle cx="120" cy="256" r="8" fill="#93c5fd" />

  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="22" fill="url(#primary-grad)" />
  <circle cx="256" cy="256" r="10" fill="#ffffff" />

  <!-- Clock Hands -->
  <!-- Hour hand pointing up-left (10 o'clock position) -->
  <line x1="256" y1="256" x2="175" y2="175" stroke="url(#primary-grad)" stroke-width="22" stroke-linecap="round" />
  
  <!-- Minute hand pointing up-right (2 o'clock position - forward progress) -->
  <line x1="256" y1="256" x2="345" y2="145" stroke="#ffffff" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Precision Tip Accent -->
  <circle cx="345" cy="145" r="10" fill="#38bdf8" />
</svg>
